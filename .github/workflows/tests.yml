name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  directory-sync-reconciliation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: data-engineering/directory-sync-reconciliation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
        env:
          DIRSYNC_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  hospital-quality-warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: data-engineering/hospital-quality-warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
        env:
          WAREHOUSE_HOST: localhost
          WAREHOUSE_USER: postgres
          WAREHOUSE_PASSWORD: postgres

  spark-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: api-monitoring-stream
            install: pip install -r requirements.txt pytest
          - project: mine-safety-lakehouse
            install: pip install -r requirements-dev.txt
    name: ${{ matrix.project }}
    defaults:
      run:
        working-directory: data-engineering/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ${{ matrix.install }}
      - run: pytest -v
        env:
          USE_DELTA: "1"
